name: Run checks

permissions:
  # Required for actions/checkout (access to source code).
  contents: read

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

# Cancel previous runs if the PR is updated before completion.
concurrency:
  group: ${{ github.ref }}-check
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: Install linux packages
      run: ./setup-linters.sh
    - name: check shell scripts
      run: shellcheck setup-env.sh install-cmake.sh install-valgrind.sh setup-linters.sh
    - name: lint code
      run: find src include tests examples -type f \( -name '*.cpp' -o -name '*.h' \) -exec clang-format-20 --dry-run --Werror -style=file {} +

  build-test:
    name: build-test (${{ matrix.compiler }}, ${{ matrix.config }})
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc-14
          - clang-18
        config:
          - sanitize
          - release
        include:
          - compiler: gcc-14
            cc: gcc
            cxx: g++
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - config: sanitize
            build_type: Debug
            compile_flags: -fsanitize=address,undefined -fno-sanitize-recover=all
            link_flags: -fsanitize=address,undefined
          - config: release
            build_type: Release
            compile_flags: ''
            link_flags: ''
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: script permissions
      run: chmod +x ./setup-env.sh ./install-cmake.sh
    - name: Install gcc
      if: matrix.compiler == 'gcc-14'
      run: ./setup-env.sh
    - name: Install clang
      if: matrix.compiler == 'clang-18'
      run: apt-get -yqq update && apt-get -yqq install --no-install-recommends clang-18 libclang-rt-18-dev libstdc++-14-dev make ca-certificates
    - name: Install cmake
      run: ./install-cmake.sh
    - name: Create build files
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DSTOCHASTIC_MODELS_WERROR=ON
        -DCMAKE_CXX_FLAGS="${{ matrix.compile_flags }}"
        -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}"
        -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.link_flags }}"
    - name: Build application
      run: cmake --build build -j"$(nproc)"
    - name: Run tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

  valgrind:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: script permissions
      run: chmod +x ./setup-env.sh ./install-cmake.sh ./install-valgrind.sh
    - name: Install dependencies
      run: ./setup-env.sh
    - name: Install cmake
      run: ./install-cmake.sh
    - name: Install valgrind
      run: ./install-valgrind.sh
    - name: Create build files
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSTOCHASTIC_MODELS_WERROR=ON
    - name: Build application
      run: cmake --build build -j"$(nproc)"
    - name: Run valgrind
      run: valgrind -s --error-exitcode=1 --tool=memcheck --leak-check=full ./build/tests/unit_tests

  package:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - name: script permissions
      run: chmod +x ./setup-env.sh ./install-cmake.sh
    - name: Install dependencies
      run: ./setup-env.sh
    - name: Install cmake
      run: ./install-cmake.sh
    - name: Create build files
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build library
      run: cmake --build build -j"$(nproc)"
    - name: Install library
      run: cmake --install build --prefix "$PWD/prefix"
    - name: Build consumer sample
      run: |
        cmake -S examples/consumer -B consumer-build -DCMAKE_PREFIX_PATH="$PWD/prefix"
        cmake --build consumer-build -j"$(nproc)"
